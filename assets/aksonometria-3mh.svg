<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8408 -2850 20366 14557"
     width="900" height="643"
     role="img" aria-label="Aksonometrinen leikkaus pohjapiirustuksesta: kolme makuuhuonetta, olohuone ja keittio, kylpyhuone, wc, apukeittio, eteinen, varasto seka terassi ja kuisti.">
<!-- =====================================================================
     Luotokoti — pohjapiirustus aksonometrisena projektiona.
     
     Aja projektin juuresta:   python3 tyokalut/aksonometria.py
     Tuottaa:                  assets/aksonometria-3mh.svg
     
     MISTA GEOMETRIA TULEE
     Tama tiedosto EI mittaa eika piirra mitaan. Se lukee saman geometrian kuin
     pohjapiirustus — pohja.py:n SEINAT, TER, KUI, ITA, W ja H — ja projisoi sen.
     Jos pohjan mitta muuttuu, se muuttuu myos taalla ilman etta tanne koskee.
     Sama periaate kuin toimialuekartassa (kartta.py): merkinnat lasketaan
     projektiosta, ei aseteta silmamaaraisesti.
     
     MIKSI SEINAN YLAPINTA ON CHARCOAL
     Pohjapiirustuksessa seina on umpea charcoalia siksi etta se on LEIKATTU.
     Aksonometriassa juuri se leikkauspinta on seinan ylapinta, joten se pysyy
     charcoalina; sivut ovat seinapintaa ja siksi vaaleampia. Kuva ei siis ole
     uusi piirros vaan sama piirustus nostettuna pystyyn.
     
     MIKSI LEIKKAUS ON 900 MM EIKA TAYSI SEINA
     Huonekorkeutta ei ole missaan datassa — ei talo-data.js:ssa eika AVOIMET.md:ssa.
     Taysikorkea seina jouduttaisiin siis keksimaan, ja se olisi keksitty luku
     sivulla joka vaittaa esittavansa taloa. 900 mm on leikkauskonventio: se
     lukee ilmiselvasti leikkaukseksi eika kattokorkeudeksi, joten se ei vaita
     talosta mitaan. Sama ratkaisu kuin suunnan C julkisivulla, joka on
     periaatekuva ja sanoo sen kuvatekstissa.
     
     Sivuvaikutuksena leikkaus on myos ainoa korkeus jolla huonejako nakyy:
     taysi seina piilottaa pohjan, joka on koko kuvan tarkoitus.
     
     Koska ikkunapenkkien korkeuksia ei ole datassa, kuva ei myoskaan vaita
     leikkaavansa ikkunoita: ikkuna on umpea seinaa, ovi on aukko. Ks. AUKOLLISET.
     
     MIKSI SYVYYSJARJESTYS ON TOPOLOGINEN LAJITTELU — JA MIKSI VAIN PEITTAVILLE
     Maalarin algoritmi tarvitsee jarjestyksen takaa eteen. Katsoja on suunnassa
     +x, +y, +z (katsesade on (1, 1, 1)), joten a on b:n edessa kun a on kokonaan
     idassa (a.x0 >= b.x1) tai kokonaan etelassa (a.y0 >= b.y1).
     
     Pelkkana relaationa se on kuitenkin ristiriitainen: jos a on b:sta itaan JA
     pohjoiseen, molemmat ehdot patevat eri suuntiin ja syntyy sykli. Nain kavi
     30 seinan joukossa 274 parille, jolloin topologinen lajittelu epaonnistui ja
     putosi varajarjestykseen — SEINAT-listan kirjoitusjarjestykseen, jolla ei ole
     mitaan tekemista syvyyden kanssa. Seinat piirtyivat toistensa paalle.
     
     Ratkaisu: ristiriitaiset parit ovat vastakkaisilla lavistajilla eivatka
     peita toisiaan ruudulla lainkaan, joten niiden jarjestyksella ei ole valia.
     Jarjestysehto lisataan VAIN kun laatikoiden projisoidut rajaukset menevat
     paallekkain. Silloin relaatio on syklitin ja lajittelu on tasmallinen.
     
     Lopputulos tarkistetaan: jokainen ruudulla peittava pari kaydaan lapi ja
     varmistetaan etta edessa oleva on piirretty myohemmin. Ilman tarkistusta
     sama virhe olisi jaanyt huomaamatta uudelleen — se nakyy vain harvoissa
     kohdissa eika kaada mitaan.
     
     MIKSI TASSA EI OLE TEKSTIA
     Sama paatos kuin pohjapiirustuksessa ja toimialuekartassa: huoneiden nimet
     renderoidaan HTML:na kuvan paalle. Nimien paikat tulostuvat ajossa
     prosentteina taman kuvan omasta projektiosta — ei pohjapiirustuksen
     prosentteina, koska projektio on eri.
     
     MITEN NOUSULIIKE TOIMII
     z kuvautuu projektiossa puhtaaksi pystysiirtymaksi, joten seinan siirto
     alaspain leikkauskorkeuden verran laskee sen ylapinnan tasmalleen
     lattiatasoon — ja koska ylapinta on charcoal, se on silloin sama umpea
     seinakuvio kuin pohjapiirustuksessa. Animaatio on siis literaalisti pohjan
     nouseminen pystyyn, ei sisaanhaivytys.
     
     Sivut eivat saa nakya lattian alla matkan aikana, joten jokainen seina
     leikataan omalla pyyhkaisyalueellaan: taysikorkean seinan siluetti
     yhdistettyna lattiatason jalanjalkeen. Leikkaus on unioni, koska clipPathin
     lapset yhdistyvat SVG:ssa.
     
     Leikkaus ja liike ovat ERI ryhmissa, ja niiden on pysyttava erillaan:
     CSS-muunnos SVG-elementissa siirtaa myos sen clip-pathin, jolloin seina
     liukuu alas kokonaisena eika paljastu lainkaan. Ulompi ryhma pitaa
     leikkauksen paikallaan, sisempi liikkuu.
     
     GENEROITU TIEDOSTO. Ala muokkaa kasin — aja tyokalut/aksonometria.py.
     ===================================================================== -->
<style>
  /* Varit ovat brandikirjasta ja kiinteina, koska img-elementin sisalla
     CSS-muuttujat eivat periydy. Sivulla inline-SVG:na varit tulevat sivun
     omasta CSS:sta — kokoa.py riisuu taman lohkon.
     HUOM: taman lohkon sisalto on XML:n merkkidataa, joten siina ei saa
     esiintya pienempi-kuin-merkkia eika kahta peraakkaista viivaa. Kumpikaan
     ei nay inline-SVG:na mutta molemmat rikkovat tiedoston img-elementissa,
     ja main() pysayttaa ajon jos sellainen paasee syntymaan. */
  .seina{fill:#4c4735} .seina-i{fill:#8d8672} .seina-e{fill:#a49d88}
  .lattia{fill:#f1ebdd} .lattia-i{fill:#d8d0ba} .lattia-e{fill:#c9c0a8}
  .taso{fill:#e8e0cc} .taso-i{fill:#d3cab2} .taso-e{fill:#c4baa0}
  .v{fill:none;stroke:#4c4735;stroke-width:9;stroke-linejoin:round;opacity:.30}
  /* Viiva on paksumpi kuin muut hiusviivat: sita on tarkoitus seurata
     silmalla huoneesta nimeen. Leveydella 7 se jai alipikselin paksuiseksi
     ja katosi. */
  .viite{fill:none;stroke:#6b6552;stroke-width:16;opacity:.5}
  .viite-p{fill:#6b6552;opacity:.5;stroke:none}

  /* Nousuliike. Siirto 900 laskee seinan ylapinnan lattiatasoon,
     jolloin kuva on pohjapiirustus; nollassa se on aksonometria. */
  @keyframes lk-nousu{from{transform:translateY(900px)}to{transform:none}}
  .s{animation:lk-nousu .9s cubic-bezier(.16,1,.3,1) both;
     animation-delay:calc(var(--i) * 13ms)}
  @media (prefers-reduced-motion:reduce){.s{animation:none}}
</style>

