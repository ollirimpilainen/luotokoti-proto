<svg xmlns="http://www.w3.org/2000/svg" viewBox="-300 -2800 14900 13800" width="745" height="690"
     role="img" aria-label="Pohjapiirustus: kolme makuuhuonetta, olohuone ja keittio, kylpyhuone, wc, apukeittio, eteinen, varasto seka terassi ja kuisti.">
<!-- =====================================================================
     Luotokoti — pohjapiirustuksen geometria SVG:ksi.
     
     Aja projektin juuresta:   python3 tyokalut/pohja.py
     Tuottaa:                  assets/pohjapiirustus-3mh.svg
     
     MISTÄ MITAT TULEVAT
     Lähde on valokuva Walltecin arkkitehtipiirustuksesta (Nordhem Röd,
     Vesslevägen 9, Jakobstad; ARK A-02, 1:50, Julia Lindell, 05/03/26) —
     tiedosto pohjapiirrustus.webp. Valokuvasta EI saa vektoreita, joten
     geometria on mitattu kuvasta ja kalibroitu piirustuksen omilla mitoilla:
     
       runko          13000 x 8900     (piirustuksen päämitat)
       terassi         9500 x 2500
       etukuisti       3000 x 2000
       itäkuisti       1300 x 1700     (mittaketju 6615 + 1700 + 585 = 8900)
     
     Kalibrointi tarkistettiin neljällä riippumattomalla tavalla:
       · väliseinä olohuoneen ja itäsiiven välillä osuu mitalle 9500,
         eli täsmälleen terassin päähän
       · WC:n rekonstruoitu ala 2,15 m2 (piirustus: 2,0)
       · apukeittiön ala 7,63 m2 (piirustus: 7,8)
       · ikkuna-aukkojen mitatut leveydet vastaavat karmikoodeja:
         F12x21 = 1200, F10x13 = 1000, FD10x22 = 1000, VD10x22 = 1000
     
     TARKKUUS. Seinälinjat ovat +-100 mm, oviaukot +-150 mm alkuperäisestä.
     Tämä on lukukelpoinen esityskuva, EI mittapiirustus. Rakentamiseen ja
     mitoitukseen käytetään arkkitehdin alkuperäistä piirustusta.
     
     MIKSI TÄSSÄ EI OLE TEKSTIÄ
     Sama päätös kuin toimialuekartassa (tyokalut/kartta.py): huoneiden nimet
     ja pinta-alat renderöidään HTML:nä kuvan päälle, koska SVG:n sisällä
     teksti skaalautuisi puhelimessa lukukelvottomaksi eikä olisi
     indeksoitavaa — eikä copy kuulu generoituun tiedostoon (AGENTS.md 2).
     Nimien paikat tulostuvat ajossa prosentteina, valmiina asemointiin.

     GENEROITU TIEDOSTO. Ala muokkaa kasin — aja tyokalut/pohja.py.

     Varit ovat brandikirjasta ja kirjoitettu tahan kiinteina, koska
     <img>-elementin sisalla CSS-muuttujat eivat periydy:
       lattia   #faf8f3  paper
       seina    #4c4735  charcoal
       ulkotaso #e8e0cc  beige
     ===================================================================== -->
<style>
  .lattia{fill:#faf8f3}
  .seina{fill:#4c4735}
  .taso{fill:#e8e0cc}
  .lauta{fill:none;stroke:rgba(76,71,53,.24);stroke-width:8}
  .reuna{fill:none;stroke:#4c4735;stroke-width:10;opacity:.45}
  .karmi{fill:#faf8f3;stroke:#4c4735;stroke-width:12}
  .lasi{fill:none;stroke:#4c4735;stroke-width:22;opacity:.55}
  .lehti{fill:none;stroke:#4c4735;stroke-width:26}
  .kaari{fill:none;stroke:#4c4735;stroke-width:11;opacity:.42}
  .pieli{fill:none;stroke:#4c4735;stroke-width:12;opacity:.5}
</style>

<!-- Ulkotasot: terassi, etukuisti, itakuisti -->
<g>
  <rect class="taso" x="0" y="-2500" width="9500" height="2500"/>
  <path class="lauta" d="M0 -2350 H9500 M0 -2200 H9500 M0 -2050 H9500 M0 -1900 H9500 M0 -1750 H9500 M0 -1600 H9500 M0 -1450 H9500 M0 -1300 H9500 M0 -1150 H9500 M0 -1000 H9500 M0 -850 H9500 M0 -700 H9500 M0 -550 H9500 M0 -400 H9500 M0 -250 H9500 M0 -100 H9500"/>
  <rect class="reuna" x="0" y="-2500" width="9500" height="2500"/>
  <rect class="taso" x="7370" y="8900" width="3000" height="2000"/>
  <path class="lauta" d="M7370 9050 H10370 M7370 9200 H10370 M7370 9350 H10370 M7370 9500 H10370 M7370 9650 H10370 M7370 9800 H10370 M7370 9950 H10370 M7370 10100 H10370 M7370 10250 H10370 M7370 10400 H10370 M7370 10550 H10370 M7370 10700 H10370 M7370 10850 H10370"/>
  <rect class="reuna" x="7370" y="8900" width="3000" height="2000"/>
  <rect class="taso" x="13000" y="6615" width="1300" height="1700"/>
  <path class="lauta" d="M13000 6765 H14300 M13000 6915 H14300 M13000 7065 H14300 M13000 7215 H14300 M13000 7365 H14300 M13000 7515 H14300 M13000 7665 H14300 M13000 7815 H14300 M13000 7965 H14300 M13000 8115 H14300 M13000 8265 H14300"/>
  <rect class="reuna" x="13000" y="6615" width="1300" height="1700"/>
</g>

