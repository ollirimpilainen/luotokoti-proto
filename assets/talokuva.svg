<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1851 -566 2901 1161"
     width="1000" height="400"
     role="img" aria-label="Talo sisaankaynnin puolelta: paaty, pitka julkisivu ikkunoineen ja harjakatto.">
<!-- =====================================================================
     Luotokoti — talo ulkoa, valokuvan kuvakulmasta.
     
     Aja projektin juuresta:   python3 tyokalut/talokuva.py
     Tuottaa:                  assets/talokuva.svg
     
     MISTA GEOMETRIA TULEE
       runko 13000 x 8900        pohja.py
       aukot ja karmikoodit      pohja.py POHJOIS / ETELA / ITASEINA
       ulkotasot                 pohja.py TER / KUI / ITA
       seinan korkeus 2826 mm    MITATTU valokuvasta homografialla
       ikkunan ylareuna 290 mm   MITATTU, raystään alapuolella
       kattokaltevuus 28 astetta PERIAATE, riktning-c-ritning.html
     
     Ikkunoiden korkeudet luetaan karmikoodeista (F12x21 = 1200 x 2100 mm).
     Kiintea korkeus oli vaarin: kylpyhuoneen F10x5 on 500 mm korkea nauhaikkuna.
     Tarkistus: F12x21 samalla saannolla antaa alareunan 436 mm sokkelin paalle,
     mika on tasmalleen se mika valokuvasta mitattiin.
     
     MIKSI PERSPEKTIIVI EIKA AKSONOMETRIA
     
     Aksonometria sailyttaa mittasuhteet: 13 metrin julkisivu piirtyy aina 13
     metrin mittaisena riippumatta siita kummassa paassa katsoja on. Valokuvassa
     talo-sisaankaynti lahella oleva paaty suurenee ja pakeneva julkisivu
     kutistuu nopeasti. Se on perspektiivin ominaisuus, eika sita saa
     aksonometriasta millaan kulmalla — kokeiltiin nelja (25/12, 32/6, 38/3,
     45/8) eika yksikaan osunut.
     
     VARIT EIVAT OLE TASSA TIEDOSTOSSA
     Tahot saavat luokan, eivat kiinteaa varia, ja sivu valitsee tyylin. Samasta
     kuvasta syntyy silloin paperinen versio suuntaan A ja hehkuva negatiivi
     suuntaan B ilman etta geometriaa kahdennetaan. Oma tyylilohko on mukana
     itsenaista kayttoa varten; design/kokoa.py riisuu sen.
     
     KAKSI ANSAA JOTKA MAKSOIVAT AIKAA
     1. Takatahojen karsinta hylkasi kaikki seinat. Tason normaali riippuu
        karkien kiertosuunnasta, ja se meni puolella tahoista vaarin pain.
        Normaali kaannetaan nyt osoittamaan pois kappaleen sisalta.
     2. Kuva oli peilikuva eika kameran siirtaminen auttanut. pohja.py:ssa
        +y on ETELA, joten koordinaatisto on vasenkatinen; ristitulo olettaa
        oikeakatisen. Ilman etumerkin kaantoa paaty jai kuvan vasempaan reunaan
        kameran paikasta riippumatta.
     
     GENEROITU TIEDOSTO. Ala muokkaa kasin — aja tyokalut/talokuva.py.
     ===================================================================== -->
